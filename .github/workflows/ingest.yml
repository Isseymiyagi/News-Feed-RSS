
name: Automated News Ingestion

on:
  schedule:
    # Every 4 hours (UTC)
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: news-ingestion-supabase
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
      SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify Supabase database connection and schema
        run: python news_ingestion.py --check-db

      - name: Run news ingestion
        run: python news_ingestion.py

      - name: Calculate article importance scores
        run: python importance_scoring.py

      - name: Cluster related news events
        run: python event_clustering.py
