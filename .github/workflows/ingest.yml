name: Automated News Ingestion

on:
  schedule:
    # Runs automatically 6 times a day (at 00:00, 04:00, 08:00, 12:00, 16:00, and 20:00 UTC)
    - cron: '0 */4 * * *'
  workflow_dispatch: # Lets you click a button on GitHub to test it manually anytime!

permissions:
  contents: write # Gives the cloud runner permission to save updates to news_vault.db

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run news ingestion script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python news_ingestion.py

      - name: Commit and push updated database
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add news_vault.db
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update news_vault.db"
            git pull --rebase --autostash origin main
            git push
          fi

